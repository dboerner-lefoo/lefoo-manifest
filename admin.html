<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#19202a">
  <title>LeFoO Personal Admin</title>
  <link rel="manifest" href="manifest-admin.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #19202a;
      --bg-card:   #222c38;
      --bg-hover:  #2a3647;
      --accent:    #a4d8e0;
      --text:      #ffffff;
      --text-muted:#8a9bb0;
      --present:   #4ade80;
      --absent:    #f87171;
      --radius:    14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Roboto', sans-serif;
      min-height: 100vh;
      padding: 0 0 40px;
    }

    header {
      padding: 32px 24px 20px;
      border-bottom: 1px solid rgba(164,216,224,0.12);
    }

    header h1 {
      font-family: 'Headline Gothic ATF', 'Arial Narrow', Arial, sans-serif;
      font-style: italic;
      font-size: 2rem;
      color: var(--accent);
      letter-spacing: 0.02em;
      line-height: 1;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 6px;
    }

    .stats {
      display: flex;
      gap: 16px;
      padding: 20px 24px;
    }

    .stat {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 14px 20px;
      flex: 1;
      text-align: center;
    }

    .stat-number { font-size: 1.6rem; font-weight: 600; line-height: 1; }
    .stat-number.present { color: var(--present); }
    .stat-number.absent  { color: var(--absent); }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
      padding: 0 24px;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.15s, transform 0.1s, opacity 0.15s;
      user-select: none;
    }

    .card:active { transform: scale(0.96); }
    .card:hover { border-color: rgba(164,216,224,0.2); }
    .card.present { border-color: rgba(74,222,128,0.35); }
    .card.absent  { opacity: 0.6; }

    .card-img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      object-position: top;
      display: block;
      background: #2e3f52;
    }

    .card-img-placeholder {
      width: 100%;
      aspect-ratio: 3/4;
      background: linear-gradient(160deg, #2e3f52, #3a5068);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 600;
      color: var(--accent);
    }

    .card-body {
      padding: 12px 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .card-name {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }

    .card-role {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .card-status {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      margin-top: 2px;
      width: fit-content;
    }

    .card-status.present { background: rgba(74,222,128,0.15); color: var(--present); }
    .card-status.absent  { background: rgba(248,113,113,0.12); color: var(--absent); }

    .feedback {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.85);
      background: var(--bg-card);
      border-radius: 20px;
      padding: 28px 36px;
      text-align: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      border: 1px solid rgba(164,216,224,0.2);
      min-width: 200px;
    }

    .feedback.show {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .feedback-icon { font-size: 2.5rem; line-height: 1; margin-bottom: 10px; }
    .feedback-name { font-size: 1rem; font-weight: 600; color: var(--accent); }
    .feedback-status { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .backdrop.show { opacity: 1; pointer-events: auto; }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--text-muted);
      font-size: 0.9rem;
      gap: 10px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(164,216,224,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 400px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 16px; }
      header { padding: 24px 16px 16px; }
      .stats { padding: 16px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>LeFoO Admin</h1>
    <p id="last-update">Wird geladen...</p>
  </header>

  <div class="stats">
    <div class="stat">
      <div class="stat-number present" id="count-present">–</div>
      <div class="stat-label">Anwesend</div>
    </div>
    <div class="stat">
      <div class="stat-number absent" id="count-absent">–</div>
      <div class="stat-label">Abwesend</div>
    </div>
  </div>

  <div class="grid" id="grid">
    <div class="loading" style="grid-column:1/-1"><div class="spinner"></div> Laden...</div>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <div class="feedback" id="feedback">
    <div class="feedback-icon" id="feedback-icon"></div>
    <div class="feedback-name" id="feedback-name"></div>
    <div class="feedback-status" id="feedback-status"></div>
  </div>

  <script>
    const API = 'https://script.google.com/macros/s/AKfycbz23Kwbmn6RnQ7lbpKa5n527kAlxbXF21FX4DIOXLZYAF4IwG4Ko_Nuq5Cc1SztgKhD/exec';
    let staffData = [];
    let toggling = false;

    function getInitials(name) {
      return name.split(' ').filter(Boolean).slice(0, 2).map(n => n[0]).join('').toUpperCase();
    }

    function formatTime(iso) {
      return new Date(iso).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    }

    function renderGrid(staff) {
      const present = staff.filter(s => s.present).length;
      document.getElementById('count-present').textContent = present;
      document.getElementById('count-absent').textContent = staff.length - present;

      document.getElementById('grid').innerHTML = staff.map(person => {
        const cls = person.present ? 'present' : 'absent';
        const statusLabel = person.present ? 'Anwesend' : 'Abwesend';
        const imgHtml = person.photo
          ? `<img class="card-img" src="${person.photo}" alt="${person.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="card-img-placeholder" style="display:none">${getInitials(person.name)}</div>`
          : `<div class="card-img-placeholder">${getInitials(person.name)}</div>`;

        return `
          <div class="card ${cls}" onclick="togglePerson('${person.name.replace(/'/g, "\\'")}')">
            ${imgHtml}
            <div class="card-body">
              <div class="card-name">${person.name}</div>
              <div class="card-role">${person.role}</div>
              <div class="card-status ${cls}">${statusLabel}</div>
            </div>
          </div>`;
      }).join('');
    }

    async function loadStaff() {
      try {
        const res = await fetch(`${API}?action=read`);
        const data = await res.json();
        staffData = data.staff;
        renderGrid(staffData);
        document.getElementById('last-update').textContent = 'Stand: ' + formatTime(data.updated);
      } catch (e) {
        document.getElementById('grid').innerHTML = `<div class="loading" style="grid-column:1/-1;color:var(--absent)">Verbindung fehlgeschlagen.</div>`;
      }
    }

    async function togglePerson(name) {
      if (toggling) return;
      toggling = true;

      const person = staffData.find(s => s.name === name);
      if (!person) { toggling = false; return; }

      const newPresent = !person.present;

      document.getElementById('feedback-icon').textContent = newPresent ? '✅' : '🔴';
      document.getElementById('feedback-name').textContent = name;
      document.getElementById('feedback-status').textContent = newPresent ? 'Jetzt anwesend' : 'Jetzt abwesend';
      document.getElementById('feedback').classList.add('show');
      document.getElementById('backdrop').classList.add('show');

      person.present = newPresent;
      renderGrid(staffData);

      try {
        const res = await fetch(`${API}?action=toggle&name=${encodeURIComponent(name)}`);
        const data = await res.json();
        if (data.error) {
          person.present = !newPresent;
          renderGrid(staffData);
          document.getElementById('feedback-icon').textContent = '⚠️';
          document.getElementById('feedback-status').textContent = 'Fehler – nicht gespeichert';
        }
      } catch (e) {
        person.present = !newPresent;
        renderGrid(staffData);
        document.getElementById('feedback-icon').textContent = '⚠️';
        document.getElementById('feedback-status').textContent = 'Keine Verbindung';
      }

      setTimeout(() => {
        document.getElementById('feedback').classList.remove('show');
        document.getElementById('backdrop').classList.remove('show');
        toggling = false;
      }, 1400);
    }

    document.getElementById('backdrop').addEventListener('click', () => {
      document.getElementById('feedback').classList.remove('show');
      document.getElementById('backdrop').classList.remove('show');
      toggling = false;
    });

    loadStaff();
    setInterval(loadStaff, 60000);
  </script>
</body>
</html>
