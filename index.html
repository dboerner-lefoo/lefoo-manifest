<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LeFoO</title>
  <link rel="manifest" href="https://dboerner-lefoo.github.io/lefoo-manifest/manifest.json">
  <style>
    :root {
      --bg: #ffffff;
      --tab-bg: #f5f7f9;
      --tab-border: rgba(25,32,42,0.12);
      --tab-text: #5a6472;
      --tab-active: #19202a;
      --tab-active-text: #19202a;
      --tab-indicator: #19202a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #19202a;
        --tab-bg: #232c38;
        --tab-border: rgba(255,255,255,0.08);
        --tab-text: #8a9bb0;
        --tab-active: #43b3e1;
        --tab-active-text: #f0f4f8;
        --tab-indicator: #43b3e1;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
    }

    .tab-content {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .tab-pane {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: var(--bg);
    }

    .tab-pane.active {
      display: block;
    }

    iframe.tab-pane {
      width: 100%;
      height: 100%;
    }

    /* Personal tab uses an iframe too but loads our own page */
    .tab-bar {
      display: flex;
      background: var(--tab-bg);
      border-top: 0.5px solid var(--tab-border);
      padding-bottom: env(safe-area-inset-bottom);
      flex-shrink: 0;
      z-index: 100;
    }

    .tab-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 0 8px;
      gap: 4px;
      background: none;
      border: none;
      cursor: pointer;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      color: var(--tab-text);
      transition: color 0.15s;
    }

    .tab-btn.active {
      color: var(--tab-active-text);
    }

    .tab-btn.active::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 2px;
      background: var(--tab-indicator);
      border-radius: 0 0 2px 2px;
    }

    .tab-icon {
      width: 24px;
      height: 24px;
    }

    .tab-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      font-weight: 500;
    }

    .fallback-msg {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      padding: 2rem;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--tab-text);
      font-size: 14px;
      line-height: 1.6;
    }

    .fallback-msg a {
      color: var(--tab-indicator);
      text-decoration: none;
      font-weight: 500;
    }
  </style>
</head>
<body>
<div class="app-shell">

  <div class="tab-content">
    <!-- Webseite Tab -->
    <div class="tab-pane active" id="pane-web">
      <iframe
        src="https://www.lefoo.de"
        class="tab-pane active"
        id="iframe-web"
        title="LeFoO Webseite"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
        loading="lazy">
      </iframe>
      <div class="fallback-msg" id="fallback-web" style="display:none">
        <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.6 9h16.8M3.6 15h16.8M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>
        </svg>
        <p>Die Webseite kann hier nicht direkt geladen werden.</p>
        <a href="https://www.lefoo.de" target="_blank">lefoo.de im Browser öffnen</a>
      </div>
    </div>

    <!-- Personal Tab -->
    <iframe
      src="https://dboerner-lefoo.github.io/lefoo-manifest/personal.html"
      class="tab-pane"
      id="pane-personal"
      title="Ansprechbares Personal"
      loading="lazy">
    </iframe>
  </div>

  <nav class="tab-bar">
    <button class="tab-btn active" id="btn-web" onclick="switchTab('web')">
      <svg class="tab-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.6 9h16.8M3.6 15h16.8M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>
      </svg>
      <span class="tab-label">Webseite</span>
    </button>
    <button class="tab-btn" id="btn-personal" onclick="switchTab('personal')">
      <svg class="tab-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 0 0-4-4h-1M9 20H4v-2a4 4 0 0 1 4-4h1m4-4a4 4 0 1 0-4 0 4 4 0 0 0 4 0z"/>
      </svg>
      <span class="tab-label">Personal</span>
    </button>
  </nav>

</div>

<script>
  let current = 'web';

  function switchTab(tab) {
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('pane-' + tab).classList.add('active');
    document.getElementById('btn-' + tab).classList.add('active');
    current = tab;
  }

  // Prüfen ob iframe geblockt wird
  const webIframe = document.getElementById('iframe-web');
  webIframe.addEventListener('load', function() {
    try {
      const doc = webIframe.contentDocument || webIframe.contentWindow.document;
      if (!doc || doc.URL === 'about:blank') throw new Error();
    } catch(e) {
      document.getElementById('iframe-web').style.display = 'none';
      document.getElementById('fallback-web').style.display = 'flex';
    }
  });

  webIframe.addEventListener('error', function() {
    document.getElementById('iframe-web').style.display = 'none';
    document.getElementById('fallback-web').style.display = 'flex';
  });
</script>
</body>
</html>
