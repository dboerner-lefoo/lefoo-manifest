<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeFoO Personal</title>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #f5f7f9;
      --text-primary: #19202a;
      --text-secondary: #5a6472;
      --border: rgba(25,32,42,0.12);
      --available-color: #00ae42;
      --available-bg: #e6f8ec;
      --unavailable-color: #e3424d;
      --unavailable-bg: #fdecea;
      --filter-active-bg: #19202a;
      --filter-active-text: #ffffff;
      --dot-available: #00ae42;
      --dot-unavailable: #e3424d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #19202a;
        --card-bg: #232c38;
        --text-primary: #f0f4f8;
        --text-secondary: #8a9bb0;
        --border: rgba(255,255,255,0.08);
        --available-color: #43b3e1;
        --available-bg: rgba(67,179,225,0.12);
        --unavailable-color: #e3424d;
        --unavailable-bg: rgba(227,66,77,0.12);
        --filter-active-bg: #43b3e1;
        --filter-active-text: #19202a;
        --dot-available: #43b3e1;
        --dot-unavailable: #e3424d;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
    .header { padding: 1.5rem 1rem 1rem; background: var(--card-bg); border-bottom: 0.5px solid var(--border); margin-bottom: 1rem; position: sticky; top: 0; z-index: 10; }
    .header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .logo { height: 28px; }
    .header h1 { font-size: 18px; font-weight: 600; color: var(--text-primary); }
    .header p { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
    .filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn { font-size: 12px; padding: 5px 14px; border-radius: 20px; border: 0.5px solid var(--border); background: var(--bg); color: var(--text-secondary); cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent; }
    .filter-btn.active { background: var(--filter-active-bg); color: var(--filter-active-text); border-color: var(--filter-active-bg); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 12px; padding: 0 1rem 2rem; }
    .card { background: var(--card-bg); border-radius: 12px; border: 0.5px solid var(--border); overflow: hidden; transition: opacity 0.25s, filter 0.25s; }
    .card.unavailable { opacity: 0.42; filter: grayscale(0.55); }
    .card-photo { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
    .card-photo-initials { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 600; }
    .card-body { padding: 10px 12px 12px; }
    .name-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .dot-a { background: var(--dot-available); }
    .dot-u { background: var(--dot-unavailable); }
    .name { font-size: 13px; font-weight: 600; color: var(--text-primary); line-height: 1.3; }
    .role { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; line-height: 1.4; }
    .email { font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status-label { font-size: 11px; font-weight: 500; margin-top: 8px; padding: 3px 9px; border-radius: 20px; display: inline-block; }
    .label-a { background: var(--available-bg); color: var(--available-color); }
    .label-u { background: var(--unavailable-bg); color: var(--unavailable-color); }
    .loading { text-align: center; padding: 4rem 1rem; color: var(--text-secondary); font-size: 14px; }
    .error { text-align: center; padding: 3rem 1rem; color: var(--unavailable-color); font-size: 14px; line-height: 1.6; }
    .empty { grid-column: 1/-1; text-align: center; padding: 3rem 1rem; color: var(--text-secondary); font-size: 14px; }
    .last-updated { text-align: center; font-size: 11px; color: var(--text-secondary); padding: 0 1rem 1.5rem; }
    .retry-btn { margin-top: 12px; display: inline-block; padding: 8px 20px; border-radius: 20px; border: 0.5px solid var(--unavailable-color); color: var(--unavailable-color); background: transparent; font-size: 13px; cursor: pointer; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <img class="logo" src="https://images.squarespace-cdn.com/content/v1/5eed22db70040764cc5f58cb/74d5803e-07a0-4f64-8aeb-a101f5e94bde/Logo_School_Sigil.png?format=100w" alt="LeFoO">
    <h1>Ansprechbares Personal</h1>
  </div>
  <p>Wer ist gerade für dich da?</p>
  <div class="filter-row">
    <button class="filter-btn active" onclick="setFilter('all',this)">Alle</button>
    <button class="filter-btn" onclick="setFilter('available',this)">Verfügbar</button>
    <button class="filter-btn" onclick="setFilter('unavailable',this)">Nicht verfügbar</button>
  </div>
</div>

<div id="content">
  <div class="loading">Daten werden geladen...</div>
</div>
<div class="last-updated" id="last-updated"></div>

<script>
  const API = 'https://script.google.com/macros/s/AKfycbz23Kwbmn6RnQ7lbpKa5n527kAlxbXF21FX4DIOXLZYAF4IwG4Ko_Nuq5Cc1SztgKhD/exec';

  const COLORS = [
    { bg: '#d4eef7', fg: '#185fa5' },
    { bg: '#cce8d6', fg: '#0f6e56' },
    { bg: '#f5e2cc', fg: '#854f0b' },
    { bg: '#e8d8f0', fg: '#534ab7' },
    { bg: '#f5d4da', fg: '#993556' },
    { bg: '#d8ecc8', fg: '#3b6d11' },
    { bg: '#faeeda', fg: '#854f0b' },
    { bg: '#fbeaf0', fg: '#993556' },
  ];

  let allStaff = [];
  let currentFilter = 'all';

  function initials(name) {
    return name.trim().split(/\s+/).map(n => n[0]).slice(0, 2).join('').toUpperCase();
  }

  function isAvailable(val) {
    if (typeof val === 'boolean') return val;
    if (typeof val === 'string') return val.toUpperCase() === 'TRUE' || val === '1';
    return false;
  }

  async function loadData() {
    try {
      const res = await fetch(API);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      allStaff = json.filter(r => r.Name && r.Name.trim()).map(r => ({
        name: r.Name || '',
        role: r['Zuständigkeit'] || '',
        email: r.Email || '',
        available: isAvailable(r['Verfügbar']),
        photo: r['Foto_URL'] || ''
      }));
      const now = new Date();
      document.getElementById('last-updated').textContent =
        'Zuletzt aktualisiert: ' + now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr';
      render();
    } catch (e) {
      document.getElementById('content').innerHTML =
        '<div class="error">Daten konnten nicht geladen werden.<br>' + e.message +
        '<br><button class="retry-btn" onclick="loadData()">Erneut versuchen</button></div>';
    }
  }

  function render() {
    const visible = allStaff.filter(p =>
      currentFilter === 'all' ? true :
      currentFilter === 'available' ? p.available : !p.available
    );

    const content = document.getElementById('content');

    if (!visible.length) {
      content.innerHTML = '<div class="grid"><div class="empty">Keine Einträge gefunden.</div></div>';
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'grid';

    visible.forEach((p) => {
      const idx = allStaff.indexOf(p);
      const color = COLORS[idx % COLORS.length];
      const inits = initials(p.name);

      const card = document.createElement('div');
      card.className = 'card' + (p.available ? '' : ' unavailable');

      const photoHTML = p.photo
        ? `<img class="card-photo" src="${p.photo}" alt="${p.name}" loading="lazy"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
           <div class="card-photo-initials" style="display:none;background:${color.bg};color:${color.fg}">${inits}</div>`
        : `<div class="card-photo-initials" style="background:${color.bg};color:${color.fg}">${inits}</div>`;

      card.innerHTML = `
        ${photoHTML}
        <div class="card-body">
          <div class="name-row">
            <span class="status-dot ${p.available ? 'dot-a' : 'dot-u'}"></span>
            <span class="name">${p.name}</span>
          </div>
          <div class="role">${p.role}</div>
          <div class="email">${p.email}</div>
          <span class="status-label ${p.available ? 'label-a' : 'label-u'}">${p.available ? 'Verfügbar' : 'Nicht verfügbar'}</span>
        </div>`;

      grid.appendChild(card);
    });

    content.innerHTML = '';
    content.appendChild(grid);
  }

  function setFilter(type, btn) {
    currentFilter = type;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  loadData();
  setInterval(loadData, 60000);
</script>
</body>
</html>
